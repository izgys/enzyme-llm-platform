[project]
name = "enzyme-llm-platform"
version = "0.1.0"
description = "Protein Language Model (PLM) fine-tuning for enzyme sub-class classification with homology-aware evaluation and calibrated uncertainty"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Iker Zapirain Gysling" }
]

dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pydantic>=2.0",
    "torch>=2.6",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.19",
    "accelerate>=0.29",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "biopython>=1.83",
    "mlflow>=2.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "umap-learn>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.uv]
exclude-newer = "2026-01-01"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true